<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "@id": "https://marketgrowth.io/contact#webpage",
  "url": "https://marketgrowth.io/contact",
  "name": "Contact - MarketGrowth",
  "description": "Tell MarketGrowth what you are working on.",
  "isPartOf": { "@id": "https://marketgrowth.io/#website" },
  "inLanguage": "en-US"
}
</script>
</head>
<body>

<section class="hero hero-sm">
  <div class="glow" style="background:var(--glow-a); width:34rem; height:34rem; top:-14rem; left:-12rem;"></div>
  <div class="glow" style="background:var(--glow-b); width:30rem; height:30rem; top:-6rem; right:-12rem;"></div>
  <div data-component="site-header"></div>
  <div class="center">
    <p class="badge reveal" data-delay="300">Contact</p>
    <h1 id="headline">Start a conversation.</h1>
    <p class="sub" id="subline">Tell us what you are working on. We reply within one business day.</p>
  </div>
</section>

<main>
  <section class="section">
    <div class="wrap" style="max-width:34rem;">
      <div class="card sr">
        <form action="https://api.web3forms.com/submit" method="POST" class="modal-like">
          <input type="hidden" name="access_key" value="d55d2f53-8e38-430f-b536-c77831ddda7f">
          <input type="hidden" name="subject" value="New inquiry from marketgrowth.io (contact page)">
          <input type="checkbox" name="botcheck" style="display:none;" tabindex="-1" autocomplete="off">
          <label>Your name<input type="text" name="name" required placeholder="Your name"></label>
          <label>Email address<input type="email" name="email" required placeholder="you@company.com"></label>
          <label>What are you working on?<textarea name="message" rows="5" required placeholder="A short note is enough."></textarea></label>
          <button type="submit" class="pill">Send message</button>
        </form>
        <p style="margin-top:1.25rem;font-size:0.82rem;color:var(--muted);">Or email <a href="mailto:support@marketgrowth.io" style="color:var(--heading);">support@marketgrowth.io</a>. We never sell or share your information.</p>
      </div>
    </div>
  </section>
</main>

<div data-component="site-footer"></div>

<script src="js/studio.js"></script>
</body>
</html>
